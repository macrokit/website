# macrokit.dev — static landing site.
# Pre-launch HTTP-only stub; the second server block is added after
# certbot has issued certs (DNS A record must point to this server first).

server {
    listen 80;
    listen [::]:80;
    server_name macrokit.dev www.macrokit.dev;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Canonical host: www -> apex
    if ($host = www.macrokit.dev) {
        return 301 https://macrokit.dev$request_uri;
    }

    root /macrokit/website/public;
    index index.html;

    # Long cache for assets, short for HTML
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Hide nginx version, basic hardening
    server_tokens off;
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

