# macrokit.dev — static landing site.
#
# Two server blocks:
#   1. HTTP (80): serves Let's Encrypt ACME challenges; redirects everything
#      else to HTTPS.
#   2. HTTPS (443): serves the static site, canonicalizes www -> apex.
#
# TLS certs are managed by certbot (/etc/letsencrypt/live/macrokit.dev/).
# Renewal is automatic via certbot.timer. The cert/key lines below match
# what certbot writes; edit them and you must keep the comments certbot
# uses to recognize this file as one it manages.

server {
    listen 80;
    listen [::]:80;
    server_name macrokit.dev www.macrokit.dev;

    # Let's Encrypt HTTP-01 challenge (kept on :80)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    server_name macrokit.dev www.macrokit.dev;

    ssl_certificate     /etc/letsencrypt/live/macrokit.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/macrokit.dev/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;   # managed by Certbot

    # Canonical host: www -> apex
    if ($host = www.macrokit.dev) {
        return 301 https://macrokit.dev$request_uri;
    }

    root /macrokit/website/public;
    index index.html;

    # Long cache for static assets
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Hide nginx version, basic hardening
    server_tokens off;
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
